name: Deploy market-ui to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/market-ui

            echo ">>>> Git pull"
            git pull origin main

            echo ">>>> Node version"
            node -v && npm -v

            echo ">>>> Install deps"
            npm install

            echo ">>>> Build"
            npm run build

            echo ">>>> Verify dist"
            ls -la dist/index.html dist/assets/

            echo ">>>> Update nginx root"
            TARGET="/home/ubuntu/market-ui/dist"
            NGINX_CONF=$(sudo grep -rl "root" /etc/nginx/ --include="*.conf" --include="default" 2>/dev/null | head -1)
            echo "Found nginx config: $NGINX_CONF"
            sudo cp "$NGINX_CONF" "${NGINX_CONF}.bak"
            sudo sed -i "s|root .*;|root ${TARGET};|" "$NGINX_CONF"

            sudo nginx -t

            echo ">>>> Restart nginx"
            sudo systemctl restart nginx

            echo ">>>> Verify deployment"
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost/ || echo "WARN: curl check failed"
            echo ""
            echo ">>>> Done"