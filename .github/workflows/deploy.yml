name: Deploy market-ui to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/market-ui

            echo ">>>> Git pull"
            git pull origin main

            echo ">>>> Node version"
            node -v && npm -v

            echo ">>>> Install deps"
            npm install

            echo ">>>> Build"
            npm run build

            echo ">>>> Verify dist"
            ls -la dist/index.html dist/assets/

            echo ">>>> Update nginx config"
            TARGET="/home/ubuntu/market-ui/dist"
            NGINX_CONF="/etc/nginx/sites-available/market-ui"

            if [ ! -f "$NGINX_CONF" ]; then
              echo "Creating new nginx site config"
              sudo tee "$NGINX_CONF" > /dev/null <<'NGINXEOF'
            server {
                listen 80;
                server_name _;

                root /home/ubuntu/market-ui/dist;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /assets/ {
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                }
            }
            NGINXEOF
              sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/market-ui
            else
              sudo sed -i "s|root .*;|root ${TARGET};|" "$NGINX_CONF"
            fi

            sudo nginx -t

            echo ">>>> Restart nginx"
            sudo systemctl restart nginx

            echo ">>>> Verify deployment"
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost/ || echo "WARN: curl check failed"
            echo ""
            echo ">>>> Done"