name: Deploy market-ui to EC2

on:
  push:
    branches:
      - main  # Triggers when you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/market-ui

            echo ">>>> Git pull"
            git pull origin main

            echo ">>>> Node version"
            node -v && npm -v

            echo ">>>> Install deps"
            npm install

            echo ">>>> Build"
            npm run build

            echo ">>>> Verify dist"
            ls -la dist/index.html dist/assets/

            echo ">>>> Find and fix nginx config"
            NGINX_CONF=$(sudo grep -rl "server_name\|root" /etc/nginx/ --include="*.conf" --include="default" 2>/dev/null | head -1)
            echo "Config: $NGINX_CONF"
            sudo sed -i 's|root /var/www/market-ui/dist;|root /home/ubuntu/market-ui/dist;|g' $NGINX_CONF
            sudo sed -i 's|root /var/www/market-ui;|root /home/ubuntu/market-ui/dist;|g' $NGINX_CONF
            sudo nginx -t

            echo ">>>> Restart nginx"
            sudo systemctl restart nginx
            echo ">>>> Done"