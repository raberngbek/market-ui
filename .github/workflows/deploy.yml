name: Deploy market-ui to EC2

on:
  push:
    branches:
      - main  # Triggers when you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/market-ui

            echo ">>>> Git pull"
            git pull origin main

            echo ">>>> Node version"
            node -v && npm -v

            echo ">>>> Install deps"
            npm install

            echo ">>>> Build"
            npm run build

            echo ">>>> Verify dist"
            ls -la dist/index.html dist/assets/

            echo ">>>> Show nginx configs"
            sudo grep -rn "root\|server_name\|listen" /etc/nginx/ --include="*.conf" --include="*available*" 2>/dev/null || true

            echo ">>>> Restart nginx"
            sudo systemctl restart nginx

            echo ">>>> Done"